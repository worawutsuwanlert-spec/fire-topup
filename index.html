<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FIRE TOPUP</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
}

body {
    min-height: 100vh;
    background:
        radial-gradient(circle at top, #4d0000 0%, #170000 35%, #050505 75%);
    color: white;
    display: flex;
    justify-content: center;
    padding: 25px 12px;
}

.container {
    width: 100%;
    max-width: 450px;
}

.logo {
    text-align: center;
    font-size: 38px;
    font-weight: 900;
    color: #ff1e1e;
    text-shadow: 0 0 15px #ff0000;
    margin-bottom: 5px;
}

.subtitle {
    text-align: center;
    color: #aaa;
    margin-bottom: 25px;
}

.card {
    background: rgba(15, 15, 15, .94);
    border: 1px solid #6d0000;
    border-radius: 15px;
    padding: 22px;
    box-shadow: 0 0 25px rgba(255,0,0,.18);
    margin-bottom: 15px;
}

h2 {
    color: #ff3333;
    margin-bottom: 18px;
}

label {
    display: block;
    margin-bottom: 7px;
    color: #ddd;
}

input {
    width: 100%;
    padding: 14px;
    border-radius: 9px;
    border: 1px solid #555;
    background: #090909;
    color: white;
    outline: none;
    font-size: 16px;
    margin-bottom: 18px;
}

input:focus {
    border-color: #ff2020;
    box-shadow: 0 0 8px rgba(255,0,0,.4);
}

.packages {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
}

.package {
    background: #111;
    border: 1px solid #444;
    border-radius: 10px;
    padding: 15px;
    cursor: pointer;
    text-align: center;
    transition: .2s;
}

.package:hover,
.package.active {
    border-color: #ff2020;
    background: #260707;
    box-shadow: 0 0 12px rgba(255,0,0,.35);
}

.diamond {
    color: #ff3636;
    font-size: 21px;
    font-weight: bold;
}

.price {
    color: #ddd;
    margin-top: 5px;
}

button {
    width: 100%;
    margin-top: 20px;
    padding: 15px;
    border: none;
    border-radius: 10px;
    background: linear-gradient(90deg, #8b0000, #ff1e1e);
    color: white;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 0 15px rgba(255,0,0,.3);
}

button:hover {
    filter: brightness(1.15);
}

#result {
    display: none;
    margin-top: 15px;
    padding: 13px;
    border-radius: 9px;
    background: #071b0b;
    border: 1px solid #16852c;
    color: #5cff78;
    text-align: center;
}

.footer {
    text-align: center;
    color: #666;
    font-size: 13px;
    margin-top: 20px;
}
</style>
</head>

<body>

<div class="container">

    <div class="logo">🔥 FIRE TOPUP</div>
    <div class="subtitle">เติมเกมง่าย • รวดเร็ว • ปลอดภัย</div>

    <div class="card">
        <h2>เติมเพชร</h2>

        <label for="uid">UID ผู้เล่น</label>
        <input
            id="uid"
            type="text"
            inputmode="numeric"
            placeholder="กรอก UID ของคุณ"
        >

        <label>เลือกแพ็กเกจ</label>

        <div class="packages">

            <div class="package" data-diamond="100" data-price="35">
                <div class="diamond">💎 100</div>
                <div class="price">฿35</div>
            </div>

            <div class="package" data-diamond="310" data-price="99">
                <div class="diamond">💎 310</div>
                <div class="price">฿99</div>
            </div>

            <div class="package" data-diamond="520" data-price="159">
                <div class="diamond">💎 520</div>
                <div class="price">฿159</div>
            </div>

            <div class="package" data-diamond="1060" data-price="299">
                <div class="diamond">💎 1060</div>
                <div class="price">฿299</div>
            </div>

        </div>

        <button onclick="topup()">
            เติมเงินทันที
        </button>

        <div id="result"></div>
    </div>

    <div class="card">
        <h2>⚡ วิธีเติม</h2>
        <p>1. ใส่ UID ผู้เล่น</p>
        <p>2. เลือกแพ็กเกจ</p>
        <p>3. ชำระเงินผ่านช่องทางที่กำหนด</p>
        <p>4. รอระบบตรวจสอบคำสั่งซื้อ</p>
    </div>

    <div class="footer">
        FIRE TOPUP © 2026
    </div>

</div>

<script>
let selectedPackage = null;

document.querySelectorAll(".package").forEach(pkg => {
    pkg.addEventListener("click", () => {

        document.querySelectorAll(".package")
            .forEach(x => x.classList.remove("active"));

        pkg.classList.add("active");

        selectedPackage = {
            diamond: pkg.dataset.diamond,
            price: pkg.dataset.price
        };
    });
});

function topup() {

    const uid = document.getElementById("uid").value.trim();
    const result = document.getElementById("result");

    if (!uid) {
        alert("กรุณากรอก UID ก่อน");
        return;
    }

    if (!/^[0-9]+$/.test(uid)) {
        alert("UID ต้องเป็นตัวเลขเท่านั้น");
        return;
    }

    if (!selectedPackage) {
        alert("กรุณาเลือกแพ็กเกจ");
        return;
    }

    result.style.display = "block";

    result.innerHTML =
        `สร้างคำสั่งซื้อแล้ว<br>
        UID: ${uid}<br>
        💎 ${selectedPackage.diamond} เพชร<br>
        ราคา: ฿${selectedPackage.price}`;

}
</script>

</body>
</html>
